<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Matches — GaneshNiti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg app-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">GaneshNiti</a>
    </div>
  </nav>

  <main class="container py-5">
    <h2 class="mb-1">Your matching schemes</h2>
    <p class="text-muted mb-4" id="results-subtitle">Showing sample results — this page isn't connected to the backend yet (that's Day 3).</p>

    <div id="loading" class="text-center py-5 d-none">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-3">Checking eligibility against verified schemes…</p>
    </div>

    <div id="results-list" class="row g-4"></div>
  </main>

  <footer class="app-footer text-center py-4">
    <p class="mb-0">Prototype for Smart India Hackathon 2026 — Problem Statement 92</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Render whatever the backend returned (stored by app.js just before redirecting here).
    let results = null;
    try { results = JSON.parse(sessionStorage.getItem("recommendResults")); } catch (e) {}
    if (results) {
      renderResults(results);
    } else {
      document.getElementById("results-list").innerHTML =
        '<p class="text-muted">No results yet. <a href="profile.html">Fill in your details</a> to see matching schemes.</p>';
    }
  </script>
</body>
</html>
