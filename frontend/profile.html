<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile — GaneshNiti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg app-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">GaneshNiti</a>
    </div>
  </nav>

  <main class="container py-5" style="max-width: 720px;">
    <h2 class="mb-1">Tell us about your situation</h2>
    <p class="text-muted mb-4">This takes about a minute. Nothing here is shared publicly.</p>

    <form id="profile-form">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="category" class="form-label">Category</label>
          <select class="form-select" id="category" required>
            <option value="" selected disabled>Select category</option>
            <option value="SC">SC</option>
            <option value="ST">ST</option>
            <option value="OBC">OBC</option>
            <option value="General">General</option>
            <option value="PwD">Person with Disability</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="state" class="form-label">State</label>
          <input type="text" class="form-control" id="state" placeholder="e.g. Maharashtra" required>
        </div>

        <div class="col-md-6">
          <label for="income" class="form-label">Annual family income (₹)</label>
          <input type="number" class="form-control" id="income" placeholder="e.g. 300000" min="0" required>
        </div>

        <div class="col-md-6">
          <label for="businessType" class="form-label">Business / purpose type</label>
          <input type="text" class="form-control" id="businessType" placeholder="e.g. tailoring, kirana shop, education" required>
        </div>

        <div class="col-12">
          <label for="amount" class="form-label">Amount you need (₹)</label>
          <input type="number" class="form-control" id="amount" placeholder="e.g. 140000" min="0" required>
        </div>

        <div class="col-12">
          <label for="requirement" class="form-label">Describe what you need, in your own words</label>
          <textarea class="form-control" id="requirement" rows="4"
            placeholder="e.g. I want to start a tailoring business in Maharashtra and need around ₹1.4 lakh to buy two sewing machines."></textarea>
          <div class="form-text">Optional, but the more detail you give, the better we can match you.</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg mt-4">See my matching schemes</button>
    </form>
  </main>

  <footer class="app-footer text-center py-4">
    <p class="mb-0">Prototype for Smart India Hackathon 2026 — Problem Statement 92</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
